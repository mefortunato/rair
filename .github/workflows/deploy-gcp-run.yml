name: Deploy RAIR to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'rair-511815' }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME || 'rair' }}
  ARTIFACT_REPO: 'rair-containers'

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install frontend dependencies & run build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run backend tests with uv
        run: |
          cd backend
          uv sync
          uv run pytest tests/ -v

  deploy-to-cloud-run:
    name: Deploy to Cloud Run
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Option A: Authenticate using Workload Identity Provider (Recommended)
      - name: Authenticate to Google Cloud (WIF)
        if: "${{ secrets.GCP_WIF_PROVIDER != '' }}"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # Option B: Fallback to Service Account JSON Key
      - name: Authenticate to Google Cloud (Key)
        if: "${{ secrets.GCP_WIF_PROVIDER == '' && secrets.GCP_SA_KEY != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          ./scripts/deploy-gcp.sh \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --service "${SERVICE_NAME}" \
            --mode source \
            --skip-tests
