services:
  mongodb:
    image: mongo:7.0
    container_name: rair-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.14-slim
        WORKDIR /app
        RUN pip install uv
        COPY pyproject.toml uv.lock* ./
        RUN uv pip install --system fastapi "uvicorn[standard]" motor "pydantic>=2.8.0" python-dotenv pytest httpx
        COPY src ./src
        ENV PYTHONPATH=/app/src
        EXPOSE 8000
        CMD ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: rair-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DATABASE_NAME=rair_db
      - PORT=8000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 5173
        CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    container_name: rair-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
