<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<title>RAIR - Rogue Ascension: Idle Role-playing</title>
		<meta name="description" content="Climb the Ascension Spire in RAIR, a rogue ascension idle RPG with elemental mastery, prestige ascension, active minigames, and procedural gear." />

		<!-- PWA Web App Manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Color Scheme and Theme Color -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0b0f19" />
		<meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />

		<!-- Apple iOS Web App Capabilities -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="RAIR" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

		<!-- Mobile & Windows Tile Meta -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="RAIR" />
		<meta name="msapplication-TileColor" content="#0b0f19" />
		<meta name="msapplication-TileImage" content="/icons/icon-144.png" />
		<meta name="msapplication-tap-highlight" content="no" />

		<!-- Favicons -->
		<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
		<link rel="shortcut icon" href="/favicon.ico" />

		<!-- Google Web Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
